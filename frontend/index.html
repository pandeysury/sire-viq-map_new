<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIQ AI - Ship Audit Finding Matcher</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; }
        #root { flex: 1 0 auto; display: flex; flex-direction: column; }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .main-content { flex: 1 0 auto; }
        .footer { flex-shrink: 0; }
        
        @media (max-width: 768px) {
            .text-4xl { font-size: 1.75rem; }
            .text-xl { font-size: 1rem; }
            .py-8 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
            .px-6 { padding-left: 1rem; padding-right: 1rem; }
        }
        
        @media (max-width: 640px) {
            .flex-gap-4 { flex-direction: column; }
            .stats-inline { display: block !important; }
            .stats-inline span { display: block; margin: 0.25rem 0; }
        }
        
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.2s ease;
        }
        
        .popup-content {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            animation: slideInRight 0.3s ease;
            max-width: 400px;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(400px); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

     const API_BASE_URL = window.location.origin.includes('localhost') ? 'http://localhost:8003' : '/viq-rag/api';
       // const API_BASE_URL = 'http://localhost:8000';
        

        function App() {
            const [activeModule, setActiveModule] = useState(() => {
                try {
                    const stored = localStorage.getItem('viqmap_active_module');
                    return stored === 'risq' ? 'risq' : 'viq';
                } catch (e) {
                    return 'viq';
                }
            });
            const [query, setQuery] = useState('');
            const [vesselType, setVesselType] = useState('All');
            const [vesselTypes, setVesselTypes] = useState(['All']);
            const [results, setResults] = useState([]);
            const [risqStats, setRisqStats] = useState(null);
            const [loading, setLoading] = useState(false);
            const [stats, setStats] = useState(null);
            const [error, setError] = useState('');
            const [feedbackStats, setFeedbackStats] = useState(null);
            const [showFeedbackModal, setShowFeedbackModal] = useState(false);
            const [feedbackData, setFeedbackData] = useState(null);
            const [popup, setPopup] = useState({ show: false, type: '', message: '' });
            const [toast, setToast] = useState({ show: false, type: '', message: '' });
            const [searchingButton, setSearchingButton] = useState(null);
            const [hasSearched, setHasSearched] = useState(false);
            const [clarification, setClarification] = useState(null);
            const [clarificationText, setClarificationText] = useState('');
            const [clarificationViq, setClarificationViq] = useState('');
            const [clarificationSubmitting, setClarificationSubmitting] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [historyItems, setHistoryItems] = useState([]);

            // ===== Local (per-browser) search history — last 10 per module,
            // kept separate for VIQ and RISQ so switching modules never
            // leaks the other module's queries. Never sent to the backend. =====
            const HISTORY_KEY = (m) => `viqmap_history_${m}`;

            const loadHistory = (m) => {
                try {
                    const raw = localStorage.getItem(HISTORY_KEY(m));
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    return [];
                }
            };

            const saveToHistory = (m, q) => {
                const trimmed = (q || '').trim();
                if (!trimmed) return;
                try {
                    const existing = loadHistory(m).filter(item => item.query !== trimmed);
                    const updated = [{ query: trimmed, timestamp: new Date().toISOString() }, ...existing].slice(0, 10);
                    localStorage.setItem(HISTORY_KEY(m), JSON.stringify(updated));
                    if (m === activeModule) setHistoryItems(updated);
                } catch (e) { /* ignore storage errors (e.g. private mode / full quota) */ }
            };

            useEffect(() => {
                setHistoryItems(loadHistory(activeModule));
                setShowHistory(false);
            }, [activeModule]);

            const runHistoryQuery = (q) => {
                setQuery(q);
                setShowHistory(false);
                handleSearch(q);
            };

            const switchModule = (newModule) => {
                if (newModule === activeModule) return;
                try {
                    localStorage.setItem('viqmap_active_module', newModule);
                } catch (e) { /* ignore storage errors (e.g. private mode) */ }
                setActiveModule(newModule);
                // Switching modules must not carry over the previous module's
                // context — clear query/results/errors/clarification state.
                setQuery('');
                setResults([]);
                setError('');
                setHasSearched(false);
                setClarification(null);
                setClarificationText('');
                setClarificationViq('');
            };

            useEffect(() => {
                if (activeModule === 'risq') {
                    fetchRisqStats();
                }
            }, [activeModule]);

            useEffect(() => {
                if (toast.show) {
                    const timer = setTimeout(() => {
                        setToast({ show: false, type: '', message: '' });
                    }, 5000);
                    return () => clearTimeout(timer);
                }
            }, [toast.show]);

            useEffect(() => {
                fetchVesselTypes();
                fetchStats();
                fetchFeedbackStats();
            }, []);

            const fetchVesselTypes = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/v1/vessel-types`);
                    const data = await response.json();
                    setVesselTypes(data.vessel_types || ['All']);
                } catch (err) {
                    console.error('Error fetching vessel types:', err);
                    setToast({ show: true, type: 'error', message: 'Failed to load vessel types' });
                }
            };

            const fetchStats = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/v1/stats`);
                    const data = await response.json();
                    setStats(data);
                } catch (err) {
                    console.error('Error fetching stats:', err);
                    setToast({ show: true, type: 'error', message: 'Failed to load statistics' });
                }
            };

            const fetchFeedbackStats = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/v1/feedback/stats`);
                    const data = await response.json();
                    setFeedbackStats(data.feedback_stats);
                } catch (err) {
                    console.error('Error fetching feedback stats:', err);
                    setToast({ show: true, type: 'error', message: 'Failed to load feedback stats' });
                }
            };

            const fetchRisqStats = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/v1/risq/stats`);
                    const data = await response.json();
                    setRisqStats(data);
                } catch (err) {
                    console.error('Error fetching RISQ stats:', err);
                }
            };

            const handleRisqAsk = async (queryOverride = null) => {
                const searchQuery = queryOverride || query;

                if (!searchQuery.trim()) {
                    setError('Please enter a RISQ question or reference code');
                    return;
                }

                setLoading(true);
                setError('');
                setResults([]);
                setHasSearched(true);
                setClarification(null);
                setClarificationText('');
                setClarificationViq('');

                try {
                    const response = await fetch(`${API_BASE_URL}/api/v1/risq/ask`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: searchQuery, top_k: 3 })
                    });
                    if (!response.ok) {
                        throw new Error('RISQ query failed');
                    }
                    const data = await response.json();
                    // Same shape as VIQ matches so the existing VIQ result
                    // cards can be reused as-is: just reference + question.
                    const mapped = (data.matches || []).map(m => ({
                        viq_number: m.risq_code,
                        question: m.question,
                        vessel_types: '',
                        similarity_score: m.similarity_score,
                        context: null
                    }));
                    setResults(mapped);
                    saveToHistory('risq', searchQuery);
                    if (mapped.length === 0) {
                        setClarification({
                            title: 'What do you mean?',
                            message: 'I could not understand the finding clearly enough to match a RISQ reference. Please describe the exact area, equipment, defect, and evidence.',
                            suggestions: []
                        });
                    }
                } catch (err) {
                    setError(`Error: ${err.message}`);
                    console.error('RISQ ask error:', err);
                } finally {
                    setLoading(false);
                }
            };

            const handleSearch = async (queryOverride = null) => {
                if (activeModule === 'risq') {
                    return handleRisqAsk(queryOverride);
                }

                const searchQuery = queryOverride || query;

                if (!searchQuery.trim()) {
                    setError('Please enter an audit finding');
                    return;
                }

                setLoading(true);
                setError('');
                setResults([]);
                setHasSearched(true);
                setClarification(null);
                setClarificationText('');
                setClarificationViq('');

                try {
                    const [quickResponse, aiResponse] = await Promise.all([
                        fetch(`${API_BASE_URL}/api/v1/search`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ query: searchQuery, vessel_type: vesselType, top_k: 3 })
                        }),
                        fetch(`${API_BASE_URL}/api/v1/analyze-finding`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ query: searchQuery, vessel_type: vesselType, top_k: 3})
                        })
                    ]);

                    if (!quickResponse.ok || !aiResponse.ok) {
                        throw new Error('Search failed');
                    }

                    const [quickData, aiData] = await Promise.all([
                        quickResponse.json(),
                        aiResponse.json()
                    ]);

                    const mergedResults = [...(aiData.matches || []), ...(quickData.matches || [])];
                    const uniqueResults = Array.from(
                        new Map(mergedResults.map(m => [m.viq_number, m])).values()
                    ).sort((a, b) => b.similarity_score - a.similarity_score);

                    setResults(uniqueResults);
                    saveToHistory('viq', searchQuery);
                    if (uniqueResults.length === 0) {
                        setClarification(buildClarificationPrompt(searchQuery));
                    }
                } catch (err) {
                    setError(`Error: ${err.message}`);
                    console.error('Search error:', err);
                } finally {
                    setLoading(false);
                }
            };

            const handleClearChat = () => {
                setQuery('');
                setResults([]);
                setError('');
                setHasSearched(false);
                setClarification(null);
                setClarificationText('');
                setClarificationViq('');
            };

            const buildClarificationPrompt = (text) => {
                const normalized = text.toLowerCase();
                const suggestions = [];

                if (
                    normalized.includes('save-all') ||
                    normalized.includes('save all') ||
                    normalized.includes('drip tray') ||
                    normalized.includes('aft spring') ||
                    normalized.includes('frozen')
                ) {
                    suggestions.push({
                        label: 'Save-all plug / drip tray condition',
                        query: 'Save-all plug for aft spring drip tray was frozen or seized and the drip tray could not be drained properly.'
                    });
                }

                return {
                    title: suggestions.length > 0 ? 'Did you mean this?' : 'What do you mean?',
                    message: suggestions.length > 0
                        ? 'The finding is not clear enough for a confident VIQ match. Please confirm or refine it.'
                        : 'I could not understand the finding clearly enough to match a VIQ. Please describe the exact equipment, location, defect, and consequence.',
                    suggestions
                };
            };

            const searchClarificationSuggestion = (suggestedQuery) => {
                setQuery(suggestedQuery);
                handleSearch(suggestedQuery);
            };

            const submitClarificationFeedback = async () => {
                const clarifiedFinding = clarificationText.trim();
                if (!clarifiedFinding && !clarificationViq.trim()) {
                    setToast({ show: true, type: 'warning', message: `Please enter what you meant, or provide the correct ${activeModule === 'risq' ? 'RISQ' : 'VIQ'} number` });
                    return;
                }

                // Isolated per module — never writes a RISQ clarification into
                // VIQ's feedback table/collection, or vice versa.
                const isRisq = activeModule === 'risq';
                const endpoint = isRisq ? '/api/v1/risq/feedback' : '/api/v1/feedback';
                const body = isRisq ? {
                    finding: clarifiedFinding || query,
                    suggested_risq_code: 'NO_MATCH',
                    feedback_type: 'clarification',
                    correct_risq_code: clarificationViq.trim() || null,
                } : {
                    finding: clarifiedFinding || query,
                    suggested_viq: 'NO_MATCH',
                    feedback_type: 'clarification',
                    correct_viq: clarificationViq.trim() || null,
                    confidence_score: 0
                };

                setClarificationSubmitting(true);
                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await response.json();

                    if (data.status === 'success') {
                        setToast({ show: true, type: 'success', message: 'Thanks. Your clarification was saved for learning.' });
                        if (!isRisq) fetchFeedbackStats();
                    } else {
                        setToast({ show: true, type: 'error', message: data.message || 'Failed to submit clarification' });
                    }
                } catch (err) {
                    setToast({ show: true, type: 'error', message: 'Failed to submit clarification: ' + err.message });
                } finally {
                    setClarificationSubmitting(false);
                }
            };

            const getScoreColor = (score) => {
                if (score >= 0.8) return 'text-green-600 bg-green-100';
                if (score >= 0.6) return 'text-yellow-600 bg-yellow-100';
                return 'text-red-600 bg-red-100';
            };

            const formatScore = (score) => {
                return `${(score * 100).toFixed(1)}%`;
            };

            const handleFeedback = async (match, feedbackType, correctViq = null) => {
                try {
                    // RISQ and VIQ feedback are fully isolated: separate endpoint,
                    // separate SQL table, separate Chroma collection. Never let a
                    // RISQ correction land in viq_training or vice versa.
                    const isRisq = activeModule === 'risq';
                    const endpoint = isRisq ? '/api/v1/risq/feedback' : '/api/v1/feedback';
                    const body = isRisq ? {
                        finding: query,
                        suggested_risq_code: match.viq_number,
                        feedback_type: feedbackType,
                        correct_risq_code: correctViq,
                    } : {
                        finding: query,
                        suggested_viq: match.viq_number,
                        feedback_type: feedbackType,
                        correct_viq: correctViq,
                        confidence_score: match.confidence_score
                    };

                    const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await response.json();

                    if (data.status === 'success') {
                        setToast({
                            show: true,
                            type: 'success',
                            message: feedbackType === 'thumbs_up' ?
                                'Thank you! System learned - it will give better results next time!' :
                                data.message || 'Feedback submitted successfully!'
                        });
                        if (!isRisq) fetchFeedbackStats();
                    } else {
                        setToast({ show: true, type: 'error', message: data.message || 'Failed to submit feedback' });
                    }
                } catch (err) {
                    setToast({ show: true, type: 'error', message: 'Failed to submit feedback: ' + err.message });
                }
            };

            const handleThumbsDown = (match) => {
                setFeedbackData(match);
                setShowFeedbackModal(true);
            };

            const submitCorrection = async () => {
                const correctViq = document.getElementById('correctViq').value;
                if (!correctViq) {
                    setToast({ show: true, type: 'warning', message: `Please enter the correct ${activeModule === 'risq' ? 'RISQ' : 'VIQ'} number` });
                    return;
                }
                await handleFeedback(feedbackData, 'thumbs_down', correctViq);
                setShowFeedbackModal(false);
                setFeedbackData(null);
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
                    <div className="main-content">
                        {/* Minimal top bar — no branding/header, just the module
                            toggle and a local search-history dropdown, both
                            right-aligned. Meant for embedding inside another
                            container/page, so there is no title, stats, or
                            Dashboard link here. */}
                        <div className="bg-white border-b border-gray-200 py-3 px-4">
                            <div className="flex items-center gap-3">
                                <div className="flex-1"></div>

                                <div className="flex-shrink-0 text-center text-sm md:text-base font-medium text-gray-600 whitespace-nowrap">
                                    <i className={`fas ${activeModule === 'risq' ? 'fa-clipboard-check' : 'fa-ship'} mr-2 text-purple-600`}></i>
                                    <span className="text-purple-700 font-bold">{activeModule === 'risq' ? 'RISQ' : 'VIQ'}</span> is currently active
                                </div>

                                <div className="flex-1 flex items-center justify-end gap-3">
                                <div className="bg-gray-100 rounded-lg p-1.5 flex items-center" role="group" aria-label="Module selector">
                                    <button
                                        onClick={() => switchModule('viq')}
                                        className={`px-5 py-2.5 rounded-md text-sm md:text-base font-semibold transition-all ${activeModule === 'viq' ? 'bg-white text-purple-700 shadow-sm' : 'text-gray-600 hover:text-gray-800'}`}
                                    >
                                        VIQ
                                    </button>
                                    <button
                                        onClick={() => switchModule('risq')}
                                        className={`px-5 py-2.5 rounded-md text-sm md:text-base font-semibold transition-all ${activeModule === 'risq' ? 'bg-white text-purple-700 shadow-sm' : 'text-gray-600 hover:text-gray-800'}`}
                                    >
                                        RISQ
                                    </button>
                                </div>

                                <div className="relative">
                                    <button
                                        onClick={() => setShowHistory(v => !v)}
                                        className="px-3 py-1.5 rounded-lg text-xs md:text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors flex items-center gap-1.5"
                                    >
                                        <i className="fas fa-history"></i>
                                        History
                                    </button>
                                    {showHistory && (
                                        <>
                                            <div className="fixed inset-0 z-40" onClick={() => setShowHistory(false)}></div>
                                            <div className="absolute right-0 mt-2 w-80 max-w-[90vw] bg-white border border-gray-200 rounded-lg shadow-lg z-50 max-h-96 overflow-y-auto">
                                                <div className="px-4 py-2 text-xs font-medium text-gray-500 border-b border-gray-100">
                                                    Last {historyItems.length} {activeModule === 'risq' ? 'RISQ' : 'VIQ'} searches
                                                </div>
                                                {historyItems.length === 0 ? (
                                                    <div className="px-4 py-6 text-sm text-gray-400 text-center">No recent searches yet</div>
                                                ) : (
                                                    historyItems.map((item, i) => (
                                                        <button
                                                            key={i}
                                                            onClick={() => runHistoryQuery(item.query)}
                                                            className="block w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 last:border-0 truncate"
                                                            title={item.query}
                                                        >
                                                            {item.query}
                                                        </button>
                                                    ))
                                                )}
                                            </div>
                                        </>
                                    )}
                                </div>
                                </div>
                            </div>
                        </div>

                        {/* Main Content */}
                        <div className="container mx-auto px-4 py-6 md:py-8">
                            {/* Search Section */}
                            <div className="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-6 md:mb-8">
                                <div className="mb-4 md:mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        <i className="fas fa-search mr-2"></i>
                                        Enter Audit Finding
                                    </label>
                                    <textarea
                                        value={query}
                                        onChange={(e) => {
                                            setQuery(e.target.value);
                                            setHasSearched(false);
                                            setClarification(null);
                                        }}
                                        placeholder={activeModule === 'risq'
                                            ? 'Enter audit observation to identify potentially relevant RISQ references'
                                            : 'Enter audit observation to identify potentially relevant SIRE 2.0 references'}
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm md:text-base"
                                        rows="3"
                                    />
                                </div>

                                <div className="flex flex-col sm:flex-row gap-3 md:gap-4">
                                    <button
                                        onClick={() => handleSearch()}
                                        disabled={loading}
                                        className="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 px-4 md:px-6 rounded-lg hover:from-blue-700 hover:to-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all text-sm md:text-base font-medium"
                                    >
                                        {loading ? (
                                            <span className="flex items-center justify-center">
                                                <div className="loading-spinner mr-2"></div>
                                                {activeModule === 'risq' ? 'Searching RISQ...' : 'Searching & Analyzing...'}
                                            </span>
                                        ) : (
                                            <span>
                                                <i className="fas fa-search mr-2"></i>
                                                {activeModule === 'risq' ? 'Search RISQ No.' : 'Search VIQ No.'}
                                            </span>
                                        )}
                                    </button>
                                    <button
                                        onClick={handleClearChat}
                                        disabled={loading}
                                        className="flex-1 bg-gray-500 text-white py-3 px-4 md:px-6 rounded-lg hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm md:text-base"
                                    >
                                        <i className="fas fa-eraser mr-2"></i>
                                        Clear Chat
                                    </button>
                                </div>

                                {error && (
                                    <div className="mt-4 p-3 md:p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm md:text-base">
                                        <i className="fas fa-exclamation-triangle mr-2"></i>
                                        {error}
                                    </div>
                                )}
                            </div>

                            {/* Results Section (shared by VIQ and RISQ — same layout/logic for both) */}
                            {results.length > 0 && (() => {
                                console.log('Rendering results:', results.length);
                                const bestMatches = results.filter(r => r.similarity_score >= 0.6);
                                const otherMatches = results.filter(r => r.similarity_score < 0.6);
                                console.log('Best matches:', bestMatches.length, 'Other matches:', otherMatches.length);
                                
                                return (
                                <div className="space-y-4 md:space-y-6">
                                    {/* Best Matches */}
                                    {bestMatches.length > 0 && (
                                        <>
                                            <div className="flex items-center gap-2">
                                                <i className="fas fa-star text-yellow-500 text-xl"></i>
                                                <h2 className="text-xl md:text-2xl font-bold text-gray-800">
                                                    Best Match{bestMatches.length > 1 ? 'es' : ''}
                                                </h2>
                                                <span className="text-sm text-gray-500">({bestMatches.length})</span>
                                            </div>
                                            
                                            {bestMatches.map((match, index) => (
                                        <div key={index} className="bg-white rounded-lg shadow-lg p-4 md:p-6 card-hover">
                                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-4 gap-2">
                                                <div className="flex flex-wrap items-center gap-2">
                                                    <span className="bg-blue-100 text-blue-800 text-xs md:text-sm font-medium px-3 py-1 rounded-full">
                                                        {activeModule === 'risq' ? 'RISQ' : 'VIQ'} {match.viq_number}
                                                    </span>
                                                    {index === 0 && (
                                                        <span className={`text-xs md:text-sm font-medium px-2 py-1 rounded-full ${getScoreColor(match.similarity_score)}`}>
                                                            {formatScore(match.similarity_score)} Match
                                                        </span>
                                                    )}
                                                </div>
                                                {activeModule === 'viq' && (
                                                    <div className="text-xs md:text-sm text-gray-500">
                                                        <i className="fas fa-ship mr-1"></i>
                                                        {match.vessel_types}
                                                    </div>
                                                )}
                                            </div>

                                            <h3 className="text-base md:text-lg font-semibold text-gray-800 mb-3">
                                                {match.question}
                                            </h3>

                                            {/* Feedback Buttons (module-aware: routes to /api/v1/feedback or /api/v1/risq/feedback) */}
                                            {(
                                                <div className="mt-4 pt-4 border-t border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                                    <span className="text-xs md:text-sm text-gray-600">
                                                        <i className="fas fa-question-circle mr-1"></i>
                                                        Is this result helpful?
                                                    </span>
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={() => handleFeedback(match, 'thumbs_up')}
                                                            className="flex-1 sm:flex-none px-3 md:px-4 py-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition-colors text-xs md:text-sm"
                                                            title="This result is correct"
                                                        >
                                                            <i className="fas fa-thumbs-up mr-1 md:mr-2"></i>
                                                            Correct
                                                        </button>
                                                        <button
                                                            onClick={() => handleThumbsDown(match)}
                                                            className="flex-1 sm:flex-none px-3 md:px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors text-xs md:text-sm"
                                                            title="This result is wrong"
                                                        >
                                                            <i className="fas fa-thumbs-down mr-1 md:mr-2"></i>
                                                            Wrong
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                            ))}
                                        </>
                                    )}

                                    {/* Other Possible Matches */}
                                    {otherMatches.length > 0 && (
                                        <>
                                            <div className="flex items-center gap-2 mt-8">
                                                <i className="fas fa-lightbulb text-blue-500 text-xl"></i>
                                                <h2 className="text-xl md:text-2xl font-bold text-gray-800">
                                                    Other Possible Matches
                                                </h2>
                                                <span className="text-sm text-gray-500">({otherMatches.length})</span>
                                            </div>
                                            <p className="text-sm text-gray-600 mb-4">
                                                <i className="fas fa-info-circle mr-1"></i>
                                                These results have lower confidence but may still be relevant
                                            </p>
                                            
                                            {otherMatches.map((match, index) => (
                                                <div key={`other-${index}`} className="bg-white rounded-lg shadow-lg p-4 md:p-6 card-hover border-l-4 border-yellow-400">
                                                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-4 gap-2">
                                                        <div className="flex flex-wrap items-center gap-2">
                                                            <span className="bg-blue-100 text-blue-800 text-xs md:text-sm font-medium px-3 py-1 rounded-full">
                                                                {activeModule === 'risq' ? 'RISQ' : 'VIQ'} {match.viq_number}
                                                            </span>
                                                        </div>
                                                        {activeModule === 'viq' && (
                                                            <div className="text-xs md:text-sm text-gray-500">
                                                                <i className="fas fa-ship mr-1"></i>
                                                                {match.vessel_types}
                                                            </div>
                                                        )}
                                                    </div>

                                                    <h3 className="text-base md:text-lg font-semibold text-gray-800 mb-3">
                                                        {match.question}
                                                    </h3>

                                                    {(
                                                        <div className="mt-4 pt-4 border-t border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                                            <span className="text-xs md:text-sm text-gray-600">
                                                                <i className="fas fa-question-circle mr-1"></i>
                                                                Is this result helpful?
                                                            </span>
                                                            <div className="flex gap-2">
                                                                <button
                                                                    onClick={() => handleFeedback(match, 'thumbs_up')}
                                                                    className="flex-1 sm:flex-none px-3 md:px-4 py-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition-colors text-xs md:text-sm"
                                                                    title="This result is correct"
                                                                >
                                                                    <i className="fas fa-thumbs-up mr-1 md:mr-2"></i>
                                                                    Correct
                                                                </button>
                                                                <button
                                                                    onClick={() => handleThumbsDown(match)}
                                                                    className="flex-1 sm:flex-none px-3 md:px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors text-xs md:text-sm"
                                                                    title="This result is wrong"
                                                                >
                                                                    <i className="fas fa-thumbs-down mr-1 md:mr-2"></i>
                                                                    Wrong
                                                                </button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </>
                                    )}
                                </div>
                                );
                            })()}

                            {/* No Results — same "what do you mean?" clarification UI for both modules */}
                            {!loading && hasSearched && results.length === 0 && query && (
                                <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
                                    <div className="flex items-start gap-3 mb-4">
                                        <div className="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center flex-shrink-0">
                                            <i className="fas fa-question text-yellow-600"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-lg md:text-xl font-semibold text-gray-800 mb-1">
                                                {clarification?.title || 'What do you mean?'}
                                            </h3>
                                            <p className="text-sm md:text-base text-gray-600">
                                                {clarification?.message || 'Please provide more details so the system can search again.'}
                                            </p>
                                        </div>
                                    </div>

                                    {clarification?.suggestions?.length > 0 && (
                                        <div className="mb-5 space-y-3">
                                            {clarification.suggestions.map((item, index) => (
                                                <div key={index} className="border border-blue-100 bg-blue-50 rounded-lg p-3 md:p-4">
                                                    <p className="text-sm font-medium text-blue-900 mb-2">{item.label}</p>
                                                    <p className="text-sm text-gray-700 mb-3">{item.query}</p>
                                                    <button
                                                        onClick={() => searchClarificationSuggestion(item.query)}
                                                        className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm"
                                                    >
                                                        <i className="fas fa-search mr-2"></i>
                                                        Search This
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="border-t border-gray-200 pt-4">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            <i className="fas fa-pen mr-2"></i>
                                            If this is not what you meant, explain the finding
                                        </label>
                                        <textarea
                                            value={clarificationText}
                                            onChange={(e) => setClarificationText(e.target.value)}
                                            placeholder={activeModule === 'risq'
                                                ? 'Example: Bonding wire on deck reflector was found broken during inspection.'
                                                : 'Example: Save-all plug on aft spring drip tray was seized/frozen, so accumulated liquid could not be drained.'}
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm md:text-base mb-3"
                                            rows="3"
                                        />
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Correct {activeModule === 'risq' ? 'RISQ' : 'VIQ'} number, if known
                                        </label>
                                        <input
                                            type="text"
                                            value={clarificationViq}
                                            onChange={(e) => setClarificationViq(e.target.value)}
                                            placeholder={activeModule === 'risq' ? 'Optional, e.g. 13.33' : 'Optional, e.g. 9.2.1'}
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm md:text-base mb-4"
                                        />
                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <button
                                                onClick={() => {
                                                    if (!clarificationText.trim()) {
                                                        setToast({ show: true, type: 'warning', message: 'Please enter the clarified finding first' });
                                                        return;
                                                    }
                                                    setQuery(clarificationText.trim());
                                                    handleSearch(clarificationText.trim());
                                                }}
                                                className="flex-1 bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-900 transition-colors text-sm md:text-base"
                                            >
                                                <i className="fas fa-search mr-2"></i>
                                                Search Clarified Finding
                                            </button>
                                            <button
                                                onClick={submitClarificationFeedback}
                                                disabled={clarificationSubmitting}
                                                className="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-sm md:text-base"
                                            >
                                                <i className="fas fa-comment-dots mr-2"></i>
                                                {clarificationSubmitting ? 'Submitting...' : 'Submit Feedback'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className={`toast border-l-4 ${
                            toast.type === 'success' ? 'border-green-500' :
                            toast.type === 'error' ? 'border-red-500' :
                            toast.type === 'warning' ? 'border-yellow-500' :
                            'border-blue-500'
                        }`}>
                            <div className="flex items-center gap-3">
                                <div className="flex-shrink-0">
                                    {toast.type === 'success' && <i className="fas fa-check-circle text-green-600 text-xl"></i>}
                                    {toast.type === 'error' && <i className="fas fa-times-circle text-red-600 text-xl"></i>}
                                    {toast.type === 'warning' && <i className="fas fa-exclamation-circle text-yellow-600 text-xl"></i>}
                                    {toast.type === 'info' && <i className="fas fa-info-circle text-blue-600 text-xl"></i>}
                                </div>
                                <p className="text-sm text-gray-800 flex-1">{toast.message}</p>
                                <button
                                    onClick={() => setToast({ show: false, type: '', message: '' })}
                                    className="text-gray-400 hover:text-gray-600"
                                >
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Popup Notification */}
                    {popup.show && (
                        <div className="popup-overlay" onClick={() => setPopup({ show: false, type: '', message: '' })}>
                            <div className="popup-content" onClick={(e) => e.stopPropagation()}>
                                <div className="flex items-start gap-3">
                                    <div className="flex-shrink-0">
                                        {popup.type === 'success' && (
                                            <div className="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                                                <i className="fas fa-check text-green-600 text-lg"></i>
                                            </div>
                                        )}
                                        {popup.type === 'error' && (
                                            <div className="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                                                <i className="fas fa-times text-red-600 text-lg"></i>
                                            </div>
                                        )}
                                        {popup.type === 'warning' && (
                                            <div className="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center">
                                                <i className="fas fa-exclamation text-yellow-600 text-lg"></i>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="font-semibold text-gray-900 mb-1">
                                            {popup.type === 'success' && 'Success'}
                                            {popup.type === 'error' && 'Error'}
                                            {popup.type === 'warning' && 'Warning'}
                                        </h3>
                                        <p className="text-sm text-gray-600">{popup.message}</p>
                                    </div>
                                    <button
                                        onClick={() => setPopup({ show: false, type: '', message: '' })}
                                        className="flex-shrink-0 text-gray-400 hover:text-gray-600"
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="mt-4">
                                    <button
                                        onClick={() => setPopup({ show: false, type: '', message: '' })}
                                        className="w-full py-2 px-4 bg-gray-800 text-white rounded-lg hover:bg-gray-900 transition-colors"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Feedback Modal */}
                    {showFeedbackModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg p-4 md:p-6 max-w-md w-full">
                                <h3 className="text-lg md:text-xl font-bold mb-4">
                                    <i className="fas fa-edit mr-2"></i>
                                    Provide Correct {activeModule === 'risq' ? 'RISQ' : 'VIQ'} Number
                                </h3>
                                <p className="text-sm md:text-base text-gray-600 mb-4">
                                    Wrong {activeModule === 'risq' ? 'RISQ' : 'VIQ'}: <strong>{feedbackData?.viq_number}</strong>
                                </p>
                                <input
                                    id="correctViq"
                                    type="text"
                                    placeholder={activeModule === 'risq' ? 'Enter correct RISQ reference (e.g., 13.33)' : 'Enter correct VIQ (e.g., 5.2.1)'}
                                    className="w-full p-3 border border-gray-300 rounded-lg mb-4 text-sm md:text-base"
                                />
                                <div className="flex gap-2">
                                    <button
                                        onClick={submitCorrection}
                                        className="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 text-sm md:text-base"
                                    >
                                        Submit
                                    </button>
                                    <button
                                        onClick={() => {
                                            setShowFeedbackModal(false);
                                            setFeedbackData(null);
                                        }}
                                        className="flex-1 bg-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-400 text-sm md:text-base"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
